name: Type Check

on: [push]

jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run TypeScript compiler
              run: npx tsc --noEmit
            - name: Run type coverage
              run: npx type-coverage --detail
